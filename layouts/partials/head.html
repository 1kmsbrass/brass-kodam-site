<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Params.businessName }}{{ end }}</title>
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ .Site.Params.image | absURL }}">
<meta property="og:site_name" content="{{ .Site.Params.businessName }}">
{{ if .IsHome }}<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"{{ .Site.Params.businessName }}","url":"{{ .Site.BaseURL }}","telephone":"{{ .Site.Params.phone }}","description":"{{ .Site.Params.description }}"}</script>{{ end }}
{{ if eq .Section "products" }}<script type="application/ld+json">{"@context":"https://schema.org","@type":"Product","name":"{{ .Title }}","description":"{{ .Description }}","brand":{"@type":"Brand","name":"KMS Brass"}}</script>{{ end }}
<style>
:root{--copper:#b5651d;--brass:#a67c3d;--ink:#2a2320;--paper:#faf7f2;--line:#e8dfd2}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:760px;margin:0 auto;padding:0 20px 60px;line-height:1.65;color:var(--ink);background:var(--paper)}
header{border-bottom:1px solid var(--line);padding:18px 0;margin-bottom:34px;display:flex;align-items:center;justify-content:space-between}header strong{font-size:1.05em;letter-spacing:.04em}.phone-top{font-weight:700;text-decoration:none;color:var(--copper);font-size:.95em}
h1{font-family:Georgia,"Times New Roman",serif;color:var(--ink);font-size:2em;line-height:1.2;margin-bottom:.35em}h2{font-family:Georgia,serif;color:var(--ink);font-size:1.35em;margin-top:2em}a{color:var(--copper)}ul{padding-left:1.2em}li{margin-bottom:.4em}
footer{border-top:1px solid var(--line);margin-top:70px;padding-top:18px;color:#7a7168;font-size:.8em}.video-embed,.instagram-embed{margin:1.5em 0}.video-embed iframe{width:100%;aspect-ratio:16/9;border-radius:6px}.instagram-embed iframe{width:100%;min-height:500px;border-radius:6px}img{max-width:100%;border-radius:6px}
.whatsapp-float{position:fixed;bottom:20px;right:20px;background:#25D366;color:#fff;padding:12px 18px;border-radius:30px;text-decoration:none;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.18);z-index:100}.faq-item{border-bottom:1px solid var(--line);padding:14px 0}.faq-item summary{font-weight:600;cursor:pointer;color:var(--ink)}
.article-nav{position:sticky;top:0;z-index:90;display:flex;gap:8px;align-items:center;padding:10px 0;background:var(--paper);border-bottom:1px solid var(--line);margin-bottom:16px}.article-nav a{white-space:nowrap;text-decoration:none}.nav-back,.nav-call{font-size:.88em;padding:8px 9px}.buy-button{display:inline-block;background:var(--copper);color:#fff!important;font-weight:800;text-decoration:none;padding:10px 14px;border-radius:7px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,.12)}.buy-large{font-size:1.1em;padding:13px 18px;margin:8px 0 12px}.contact-row{display:flex;gap:18px;flex-wrap:wrap}.article-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.back-link{font-size:.9em;text-decoration:none}.category-pill{font-size:.75em;border:1px solid var(--line);border-radius:20px;padding:4px 9px;color:#6e655d}.article-intro{background:#f1ebe2;border-left:3px solid var(--brass);padding:10px 13px;margin:0 0 12px;border-radius:5px;color:#5f554c}.language-switch{font-size:.88em;margin:8px 0 22px}.guide-group{border-top:1px solid var(--line);padding:20px 0}.guide-group h2{margin-top:0}.guide-group li{margin:9px 0}.language-box{margin-top:20px;padding:16px;background:#f1ebe2;border-radius:8px}.article-next{margin-top:36px;padding:20px;border:1px solid var(--line);border-radius:8px}.article-next p{margin:.3em 0 1em;color:#6e655d}
@media(max-width:520px){.article-nav{justify-content:space-between}.nav-back,.nav-call{font-size:.8em;padding:7px 5px}.buy-button{font-size:.9em;padding:9px 10px}.contact-row{gap:12px}body{padding-left:16px;padding-right:16px}h1{font-size:1.75em}.article-top{align-items:flex-start}}
</style>
<style>
/* Shared BrassKudam site shell */
.standard-page{max-width:none;padding:0 0 60px;background:#fff;color:#18212b}
.site-header{max-width:none;margin:0;padding:13px 28px;border-bottom:1px solid #dfe3e6;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:20px}
.site-brand{display:flex;flex-direction:column;color:#16202a;text-decoration:none}
.site-brand strong{font-size:1.35rem;letter-spacing:.02em}.site-brand span{font-size:.78rem;color:#69727a;margin-top:2px}
.site-contact{display:flex;flex-direction:column;text-align:right;line-height:1.25}.site-contact strong{font-size:1rem}.site-contact span{font-size:.8rem}.site-contact a{color:#333;text-decoration:none;font-weight:700}
.shared-nav{position:sticky;top:0;z-index:70;background:#fff;border-bottom:1px solid #cfd5da;box-shadow:0 2px 8px rgba(0,0,0,.05);display:grid;grid-template-columns:220px minmax(300px,1fr) auto;gap:10px;padding:8px 28px}
.shared-current{display:flex;align-items:center;gap:8px}.shared-current label{font-size:.62rem;letter-spacing:.08em;color:#92999f;font-weight:700}.shared-current select{font-size:.88rem;font-weight:800;border:1px solid #aeb7be;background:#fff;padding:8px 28px 8px 9px;border-radius:3px;color:#202a32}
.shared-search{display:flex;align-items:center;border:1px solid #aeb7be;border-radius:3px;background:#fff;min-height:40px}.shared-search span{padding-left:11px;color:#69747d}.shared-search input{border:0;outline:0;width:100%;padding:9px 10px;font:inherit}.shared-filter{border:1px solid #aeb7be;background:#fff;border-radius:3px;padding:8px 14px;font-weight:800;cursor:pointer;color:#202a32}
.site-shell{display:grid;grid-template-columns:235px minmax(0,760px);gap:0;max-width:1200px;margin:0 auto;align-items:start}
.site-sidebar{border-right:1px solid #dfe3e6;padding:18px 16px;min-height:calc(100vh - 115px);position:sticky;top:57px;align-self:start;max-height:calc(100vh - 57px);overflow:auto;background:#fff}
.sidebar-current{font-size:.9rem;font-weight:800;padding:0 7px 14px;border-bottom:1px solid #e3e6e8;margin-bottom:3px}.sidebar-nav{padding-bottom:30px}.nav-label{font-size:.67rem;letter-spacing:.08em;color:#92999f;margin:18px 7px 6px;font-weight:700}.nav-sub-label{font-size:.67rem;color:#8b9399;font-weight:700;padding:8px 7px 2px}.nav-link{display:block;color:#27323b;text-decoration:none;font-size:.88rem;line-height:1.35;padding:5px 7px;border-radius:2px}.nav-link:hover{background:#f4f5f6}
.site-content{min-width:0;padding:25px 28px 0}.site-content .article,.site-content .blog-page{max-width:760px}.standard-page footer{max-width:1200px;margin:50px auto;padding:20px}
@media(max-width:900px){
 .site-header{padding:12px 16px}.site-shell{display:block}.site-sidebar{position:fixed;left:0;top:0;width:min(82vw,320px);height:100vh;min-height:100vh;max-height:none;z-index:120;transform:translateX(-105%);transition:transform .2s ease;box-shadow:4px 0 18px rgba(0,0,0,.18);padding:18px 16px}.site-sidebar.mobile-open{transform:translateX(0)}
 .site-content{padding:18px 16px}.shared-nav{grid-template-columns:1fr auto;padding:8px 12px}.shared-current{grid-column:1/-1}.shared-search{grid-column:1/-1;grid-row:2}.shared-filter{grid-column:2;grid-row:1}
}
@media(max-width:560px){.site-brand strong{font-size:1.08rem}.site-brand span{font-size:.7rem}.site-contact strong{font-size:.9rem}.site-contact span{font-size:.75rem}.shared-current select{width:100%}.shared-current{width:100%}}
</style>
