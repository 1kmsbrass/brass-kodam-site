<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Params.businessName }}{{ end }}</title>
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
{{ with .Params.keywords }}<meta name="keywords" content="{{ delimit . ", " }}">{{ end }}
<link rel="canonical" href="{{ .Permalink }}">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
{{ with .Params.cover }}<meta property="og:image" content="{{ . | absURL }}">{{ end }}

{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "{{ .Site.Params.businessName }}",
  "url": "{{ .Site.BaseURL }}",
  "telephone": "{{ .Site.Params.phone }}",
  "email": "{{ .Site.Params.email }}",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "{{ .Site.Params.city }}",
    "addressCountry": "IN"
  },
  "description": "{{ .Site.Params.description }}"
}
</script>
{{ end }}

{{ if eq .Section "products" }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Product",
  "name": "{{ .Title }}",
  "description": "{{ .Description }}",
  "brand": "{{ .Site.Params.businessName }}"
}
</script>
{{ end }}

<style>
  :root{--copper:#b5651d;--brass:#a67c3d;--ink:#2a2320;--paper:#faf7f2;--line:#e8dfd2}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:760px;margin:0 auto;padding:0 20px 60px;line-height:1.7;color:var(--ink);background:var(--paper)}
  header{border-bottom:1px solid var(--line);padding:22px 0;margin-bottom:8px}
  header strong{font-size:1.05em;display:block;letter-spacing:.02em}
  header nav{margin-top:10px}
  header nav a{margin-right:16px;text-decoration:none;color:var(--copper);font-weight:600;font-size:.92em}
  header nav a:hover{text-decoration:underline}
  h1{font-family:Georgia,"Times New Roman",serif;color:var(--ink);font-size:1.7em;line-height:1.3;margin-bottom:.3em}
  h2{font-family:Georgia,serif;color:var(--ink);font-size:1.25em;margin-top:1.6em}
  a{color:var(--copper)}
  ul{padding-left:1.2em}
  li{margin-bottom:.4em}
  footer{border-top:1px solid var(--line);margin-top:50px;padding-top:20px;color:#7a7168;font-size:.85em}
  .video-embed,.instagram-embed{margin:1.5em 0}
  .video-embed iframe{width:100%;aspect-ratio:16/9;border-radius:6px}
  .instagram-embed iframe{width:100%;min-height:500px;border-radius:6px}
  img{max-width:100%;border-radius:6px}
  .whatsapp-float{position:fixed;bottom:20px;right:20px;background:#25D366;color:#fff;padding:12px 18px;border-radius:30px;text-decoration:none;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:100}
  .faq-item{border-bottom:1px solid var(--line);padding:14px 0}
  .faq-item summary{font-weight:600;cursor:pointer;color:var(--ink)}
</style>
