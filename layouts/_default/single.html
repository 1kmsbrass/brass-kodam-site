{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  {{ .Content }}

  {{ with .Params.faq }}
  <h2>Frequently Asked Questions</h2>
  <div class="faq-block">
    {{ range . }}
    <details class="faq-item">
      <summary>{{ .question }}</summary>
      <p>{{ .answer }}</p>
    </details>
    {{ end }}
  </div>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {{ range $i, $qa := . }}{{ if $i }},{{ end }}
      {
        "@type": "Question",
        "name": {{ $qa.question | jsonify }},
        "acceptedAnswer": { "@type": "Answer", "text": {{ $qa.answer | jsonify }} }
      }
      {{ end }}
    ]
  }
  </script>
  {{ end }}
</article>
{{ end }}
